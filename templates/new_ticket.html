{% extends 'base.html' %}{% block content %}<div class="section-heading"><div><div class="eyebrow">Support request</div><h1>Create new ticket</h1><div class="subtle">Please describe the issue and select a relevant category.</div></div><a href="/dashboard" class="btn btn-outline">← Back</a></div>
<div class="panel form-card">{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post" action="/tickets/new"><input type="hidden" name="_csrf" value="{{ csrf }}">
<div class="field"><label>Issue title</label><input name="title" placeholder="e.g. Cannot connect to college Wi-Fi" required minlength="5" maxlength="120"></div>
<div class="field"><label>Issue description</label><textarea name="description" placeholder="Explain the issue, steps you've tried, and when it started..." required minlength="15" maxlength="2000"></textarea></div>
<div class="form-grid"><div class="field"><label>Category</label><select name="category" required><option value="">Select category</option>{% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></div><div class="field"><label>Priority</label><select name="priority">{% for p in priorities %}<option value="{{ p }}" {% if p=='Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div></div>
<div class="hint" style="margin-bottom:18px">All tickets are saved to a database and are visible only to you and authorized administrators.</div>
<button class="btn" type="submit">Submit support request →</button></form></div>{% endblock %}
